name: CI

on:
  push:
  pull_request:

env:
  EMSDK_VERSION: "6.0.13"

jobs:
  native:
    name: Terminal tests (GCC 16)
    runs-on: ubuntu-24.04
    container: gcc:16
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: apt-get update && apt-get install -y --no-install-recommends cmake ninja-build git
      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
          cmake --build build -j
      - name: Test
        run: ctest --test-dir build --output-on-failure

  web:
    name: Browser build (Emscripten)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Install Emscripten ${{ env.EMSDK_VERSION }}
        run: |
          git clone --depth 1 https://github.com/emscripten-core/emsdk.git "$HOME/emsdk"
          "$HOME/emsdk/emsdk" install "$EMSDK_VERSION"
          "$HOME/emsdk/emsdk" activate "$EMSDK_VERSION"
      - name: Build
        run: |
          source "$HOME/emsdk/emsdk_env.sh"
          emcmake cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"
          cmake --build build -j
